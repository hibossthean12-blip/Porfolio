<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Profile photo placeholder for Thin Chitsothean">
  <title>Thin Chitsothean — profile photo placeholder</title>

  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#1c1630"/>
      <stop offset="0.55" stop-color="#14141d"/>
      <stop offset="1"   stop-color="#100c1c"/>
    </linearGradient>

    <linearGradient id="pbody" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0"   stop-color="#54409a"/>
      <stop offset="0.6" stop-color="#2e2550"/>
      <stop offset="1"   stop-color="#1b1730"/>
    </linearGradient>

    <linearGradient id="pskin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a6699"/>
      <stop offset="1" stop-color="#463a61"/>
    </linearGradient>

    <radialGradient id="pglow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0"   stop-color="#8b5cf6" stop-opacity="0.34"/>
      <stop offset="1"   stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <filter id="psoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#pbg)"/>
  <rect width="800" height="1000" fill="url(#pglow)"/>

  <!-- Ambient light -->
  <ellipse cx="400" cy="300" rx="260" ry="230" fill="#7c3aed" opacity="0.20" filter="url(#psoft)"/>

  <!-- Faint code brackets, signalling "software engineer" -->
  <g fill="none" stroke="#8b5cf6" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 430 L 96 480 L 150 530"/>
    <path d="M650 430 L 704 480 L 650 530"/>
  </g>
  <g fill="#8b5cf6" opacity="0.20">
    <circle cx="185" cy="330" r="6"/>
    <circle cx="615" cy="330" r="6"/>
    <circle cx="185" cy="640" r="6"/>
    <circle cx="615" cy="640" r="6"/>
  </g>

  <!-- Shoulders -->
  <path d="M60 1000 C 60 800 190 700 300 668 L 500 668 C 610 700 740 800 740 1000 Z"
        fill="url(#pbody)"/>

  <!-- Neck -->
  <path d="M340 620 h120 v80 c0 46 -120 46 -120 0 Z" fill="url(#pskin)"/>

  <!-- Head -->
  <ellipse cx="400" cy="480" rx="146" ry="166" fill="url(#pskin)"/>

  <!-- Hair -->
  <path d="M254 470
           C 254 288  546 288  546 470
           C 546 424  512 356  400 356
           C 288 356 254 424 254 470 Z"
        fill="#1b1630"/>

  <!-- Ears -->
  <ellipse cx="252" cy="492" rx="20" ry="30" fill="#6a5985"/>
  <ellipse cx="548" cy="492" rx="20" ry="30" fill="#6a5985"/>

  <!-- Collar -->
  <path d="M300 668 C 340 730 460 730 500 668"
        fill="none" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>

  <!-- Rim light on the right edge -->
  <path d="M546 470 C 548 560 536 620 500 668"
        fill="none" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
</svg>
